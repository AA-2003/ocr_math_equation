name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python train.py symbols --epochs 1 --limit 32 --output models/smoke_ocr.pth
      - run: python math_equation.py test/10.png --segment-only --preview reports/segments.png
      - run: python -m nbconvert --execute --to notebook --output-dir reports math_equation.ipynb hand_writen_detection.ipynb
